# Config B: Hybrid retrieval (dense + BM25 with RRF) — no reranking.
# Shows the lift from adding keyword search on top of dense embeddings.

corpus:
  name: "LangGraph"
  repo_url: "https://github.com/langchain-ai/docs"
  docs_subdir: "src/oss/langgraph"
  include: ["*.md", "*.mdx", "**/*.md", "**/*.mdx"]
  exclude: ["**/changelog*", "**/release-notes*", "**/api_ref*", "**/migration*"]
  base_url: "https://langchain-ai.github.io/langgraph"

chunking:
  min_tokens: 80
  max_tokens: 450
  hard_max_tokens: 1000

retrieval:
  dense_model: "BAAI/bge-small-en-v1.5"
  sparse_model: "Qdrant/bm25"
  use_sparse: true             # <-- hybrid
  prefetch_limit: 20
  fusion: "rrf"

rerank:
  provider: "none"             # <-- no reranking
  model: "Xenova/ms-marco-MiniLM-L-6-v2"
  top_n: 5
  refusal_threshold: null

generation:
  temperature: 0.1
  max_tokens: 600
  timeout_s: 30
  max_retries: 3
